webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "incognito",
        "remote-allow-origins=*",
        "disable-extensions",
        "disable-infobars"
      ]
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
  console.colors = true
}

environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com"
  }
}